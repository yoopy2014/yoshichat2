<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoshiChat</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #eef2f7; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { text-align: center; color: #0066cc; margin-top: 0; margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #d1d9e0; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus { outline: none; border-color: #0066cc; }
        button { background: #0066cc; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0052a3; }
        .hidden { display: none !important; }
        .error { color: #d93838; font-size: 13px; text-align: center; margin: 5px 0; }
        
        /* チャット画面のデザイン（LINE風の青基調） */
        #chat-screen { display: flex; flex-direction: column; height: 92vh; max-width: 650px; padding: 16px; }
        .chat-header-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .chat-layout { display: flex; flex: 1; overflow: hidden; margin-top: 12px; gap: 12px; }
        .sidebar { width: 160px; border-right: 1px solid #eee; padding-right: 8px; overflow-y: auto; }
        .chat-main { flex: 1; display: flex; flex-direction: column; }
        .messages-box { flex: 1; border: 1px solid #e1e8ed; border-radius: 8px; padding: 12px; overflow-y: auto; background: #f4f7fb; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 10px 14px; border-radius: 12px; max-width: 75%; word-break: break-all; font-size: 14px; line-height: 1.4; }
        .message.sent { background: #0066cc; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.received { background: #ffffff; color: #333; border: 1px solid #d1d9e0; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { display: flex; gap: 8px; }
        .chat-input-area input { margin: 0; }
        .chat-input-area button { width: 90px; margin: 0; }
        .user-item { padding: 8px 10px; cursor: pointer; border-radius: 6px; font-size: 14px; margin-bottom: 6px; background: #f0f4f8; color: #333; text-align: left; transition: background 0.1s; }
        .user-item:hover { background: #e2e8f0; }
        .user-item.active { background: #0066cc; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ログイン・登録画面 -->
    <div class="container" id="auth-container">
        <h2>YoshiChat</h2>
        <div id="login-form">
            <input type="text" id="login-id" placeholder="yoshiID">
            <input type="password" id="login-password" placeholder="パスワード">
            <div id="login-error" class="error"></div>
            <button onclick="login()">ログイン</button>
            <button onclick="switchMode('register')" style="background: #64748b; margin-top: 4px;">新規登録へ</button>
        </div>

        <div id="register-form" class="hidden">
            <input type="text" id="reg-id" placeholder="yoshiID (半角英数字)">
            <input type="text" id="reg-name" placeholder="表示名 (ニックネーム)">
            <input type="password" id="reg-password" placeholder="パスワード">
            <div id="reg-error" class="error"></div>
            <button onclick="register()">登録する</button>
            <button onclick="switchMode('login')" style="background: #64748b; margin-top: 4px;">ログインへ戻る</button>
        </div>
    </div>

    <!-- チャットメイン画面 -->
    <div class="container hidden" id="chat-screen">
        <div class="chat-header-bar">
            <div>
                <span style="font-size: 12px; color: #666; display: block;">ログイン中:</span>
                <span id="welcome-msg" style="font-weight: bold; color: #0066cc; font-size: 15px;"></span>
            </div>
            <button onclick="logout()" style="width: auto; padding: 6px 12px; background: #ef4444; font-size: 12px; margin:0;">ログアウト</button>
        </div>
        
        <!-- フレンド申請エリア -->
        <div style="margin-top: 10px; background: #f8fafc; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0;">
            <div style="display: flex; gap: 6px;">
                <input type="text" id="friend-target-id" placeholder="追加したい人のyoshiID" style="margin:0; font-size: 13px; padding: 8px;">
                <button onclick="sendFriendRequest()" style="width: 100px; margin:0; font-size: 13px; padding: 8px;">申請送信</button>
            </div>
            <div id="friend-requests-area" style="font-size: 13px; color: #555; margin-top: 4px;"></div>
        </div>

        <div class="chat-layout">
            <!-- フレンド一覧サイドバー -->
            <div class="sidebar" id="friends-list">
                <div style="font-weight: bold; font-size: 13px; margin-bottom: 8px; color: #475569;">フレンド</div>
            </div>

            <!-- チャットメッセージ表示・入力エリア -->
            <div class="chat-main">
                <div id="chat-header" style="font-weight: bold; font-size: 14px; margin-bottom: 6px; color: #1e293b; padding-bottom: 4px; border-bottom: 1px solid #f1f5f9;">相手を選んでください</div>
                <div class="messages-box" id="messages-box">
                    <!-- メッセージがここに表示されます -->
                </div>
                <div class="chat-input-area">
                    <input type="text" id="message-input" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">送信</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myYoshiID = "";
        let myName = "";
        let currentTargetID = "";
        let pollingTimer = null;

        function switchMode(mode) {
            if (mode === 'register') {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('register-form').classList.remove('hidden');
            } else {
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
            }
        }

        async function register() {
            const id = document.getElementById('reg-id').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const errDiv = document.getElementById('reg-error');
            errDiv.textContent = "";

            if (!id || !name || !password) {
                errDiv.textContent = "すべての項目を入力してください";
                return;
            }

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ yoshi_id: id, name: name, password: password })
            });
            const data = await res.json();
            if (res.ok) {
                alert("登録成功！ログインしてください。");
                switchMode('login');
            } else {
                errDiv.textContent = data.detail || "登録に失敗しました";
            }
        }

        async function login() {
            const id = document.getElementById('login-id').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const errDiv = document.getElementById('login-error');
            errDiv.textContent = "";

            if (!id || !password) {
                errDiv.textContent = "IDとパスワードを入力してください";
                return;
            }

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ yoshi_id: id, password: password })
            });
            const data = await res.json();
            if (res.ok) {
                myYoshiID = data.user.yoshiID;
                myName = data.user.name;
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
                document.getElementById('welcome-msg').textContent = `${myName} (${myYoshiID})`;
                
                startPolling();
            } else {
                errDiv.textContent = data.detail || "ログインに失敗しました";
            }
        }

        function logout() {
            location.reload();
        }

        async function sendFriendRequest() {
            const targetId = document.getElementById('friend-target-id').value.trim();
            if (!targetId) return;

            const res = await fetch('/api/request_friend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ my_id: myYoshiID, target_id: targetId })
            });
            const data = await res.json();
            if (res.ok) {
                alert("フレンド申請を送信しました！");
                document.getElementById('friend-target-id').value = "";
            } else {
                alert(data.detail || "申請に失敗しました");
            }
        }

        async function loadFriendRequests() {
            const res = await fetch(`/api/friend_requests/${myYoshiID}`);
            const requests = await res.json();
            const area = document.getElementById('friend-requests-area');
            if (requests.length > 0) {
                area.innerHTML = requests.map(r => `
                    <div style="background:#fef3c7; padding:6px; margin-top:4px; border-radius:4px; display:flex; justify-content:space-between; align-items:center; border: 1px solid #fde68a;">
                        <span style="color:#92400e;">${r.name} (${r.yoshiID}) から申請</span>
                        <button onclick="acceptFriend('${r.yoshiID}')" style="width:auto; padding:3px 8px; font-size:12px; margin:0; background:#d97706;">承認</button>
                    </div>
                `).join('');
            } else {
                area.innerHTML = "";
            }
        }

        async function acceptFriend(targetId) {
            await fetch('/api/accept_friend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ my_id: myYoshiID, target_id: targetId })
            });
            loadFriends();
            loadFriendRequests();
        }

        async function loadFriends() {
            const res = await fetch(`/api/friends/${myYoshiID}`);
            const friends = await res.json();
            const listDiv = document.getElementById('friends-list');
            
            let html = '<div style="font-weight: bold; font-size: 13px; margin-bottom: 8px; color: #475569;">フレンド</div>';
            friends.forEach(f => {
                const activeClass = (currentTargetID === f.yoshiID) ? 'active' : '';
                html += `<div class="user-item ${activeClass}" onclick="selectChat('${f.yoshiID}', '${f.name}')">${f.name}</div>`;
            });
            listDiv.innerHTML = html;
        }

        function selectChat(id, name) {
            currentTargetID = id;
            document.getElementById('chat-header').textContent = `${name} とのチャット`;
            loadMessages();
            loadFriends();
        }

        async function loadMessages() {
            if (!currentTargetID) return;
            const res = await fetch(`/api/messages/${myYoshiID}/${currentTargetID}`);
            const messages = await res.json();
            const box = document.getElementById('messages-box');
            
            const isAtBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 50;

            box.innerHTML = messages.map(m => {
                const type = (m.sender_id === myYoshiID) ? 'sent' : 'received';
                return `<div class="message ${type}">${escapeHTML(m.content)}</div>`;
            }).join('');

            if (isAtBottom) {
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content || !currentTargetID) return;

            await fetch('/api/send_message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sender_id: myYoshiID,
                    receiver_id: currentTargetID,
                    content: content,
                    is_stamp: false
                })
            });

            input.value = "";
            loadMessages();
        }

        function startPolling() {
            if (pollingTimer) clearInterval(pollingTimer);
            pollingTimer = setInterval(() => {
                if (myYoshiID) {
                    loadFriendRequests();
                    loadFriends();
                    if (currentTargetID) {
                        loadMessages();
                    }
                }
            }, 1500);
        }

        function escapeHTML(str) {
            return str.replace(/[&'`<>"]/g, match => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#x27;',
                '`': '&#x60;'
            })[match] || match);
        }
    </script>
</body>
</html>
